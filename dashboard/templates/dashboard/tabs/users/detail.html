<button @click="selected.user = null" class="group mb-6 text-sm font-semibold text-slate-500 hover:text-slate-900 flex items-center transition-colors">
    <svg class="mr-2 h-4 w-4 text-slate-400 group-hover:text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    Back to Directory
</button>
<div class="mb-8">
    <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm uppercase tracking-widest">
            [[ selected.user.email.substring(0, 2) ]]
        </div>
        [[ selected.user.email ]]
    </h2>
</div>
<div class="bento-card">
    <div class="bento-header"><h4 class="bento-title">Project Memberships</h4></div>
    <div class="data-table-wrapper rounded-none border-x-0 border-b-0 shadow-none">
        <table class="data-table w-full">
            <thead><tr><th>Namespace</th><th>Tenant</th><th>Cluster</th><th>Assigned Roles</th></tr></thead>
            <tbody>
                <tr v-for="access in selected.user.data" :key="access.namespace" @click="jumpTo('namespaces', access.namespace)">
                    <td class="font-bold text-slate-900">[[ access.namespace ]]</td>
                    <td class="text-slate-600 font-medium">[[ access.tenant ]]</td>
                    <td class="font-mono text-xs text-slate-500">[[ access.cluster ]]</td>
                    <td>
                        <div class="flex flex-wrap gap-1">
                            <span v-for="r in access.role.split(' & ')" :key="r" :class="['badge !mb-0 !px-1.5 !py-0.5 text-[10px]', r === 'Owner' ? 'badge-purple' : 'badge-slate']">
                                [[ r ]]
                            </span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
