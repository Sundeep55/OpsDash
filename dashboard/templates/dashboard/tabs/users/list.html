<div class="mb-6 flex gap-4 items-center">
    <div class="relative flex-1 max-w-md">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input v-model="search.user" type="text" class="w-full rounded-full border border-slate-200 pl-11 pr-4 py-2.5 text-sm font-medium text-slate-900 shadow-sm outline-none focus:ring-2 focus:ring-blue-600 transition-all" placeholder="Search users by email...">
    </div>
</div>

<div class="data-table-wrapper flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative z-0"
     :class="{ 'is-refreshing': usersLoading && usersList.length }">
    <table class="data-table w-full m-0 rounded-none border-0">
        <thead class="bg-slate-50 border-b border-slate-200">
            <tr><th class="py-3 px-4">Email Address</th><th class="py-3 px-4">Projects Accessed</th></tr>
        </thead>
        <tbody class="divide-y divide-slate-100" :aria-busy="usersLoading ? 'true' : 'false'">
            <!-- RENDER PAGINATED DATA FROM API -->
            <tr v-for="user in usersList" :key="user.email" @click="selectItem('user', user.email)" class="hover:bg-blue-50/30 transition-colors cursor-pointer">
                <td class="font-bold text-slate-900 flex items-center gap-3 px-4 py-3">
                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0 uppercase tracking-widest border border-blue-200 shadow-sm">
                        [[ user.email.substring(0, 2) ]]
                    </div>
                    [[ user.email ]]
                </td>
                <td class="px-4 py-3"><span class="badge badge-blue !m-0">[[ user.access_count ]] Namespaces</span></td>
            </tr>
            <table-skeleton v-if="usersLoading && !usersList.length" :rows="6" :cols="2"></table-skeleton>
            <tr v-else-if="!usersList.length"><td colspan="2" class="text-center italic text-slate-500 py-10 bg-slate-50">No users found.</td></tr>
        </tbody>
    </table>

    <!-- API PAGINATION FOOTER -->
    <div class="flex items-center justify-between px-6 py-3 bg-slate-50 border-t border-slate-200">
        <span class="text-sm font-medium text-slate-500">
            Showing Page <span class="font-bold text-slate-700">[[ userPagination.page ]]</span> of <span class="font-bold text-slate-700">[[ userPagination.totalPages ]]</span> 
            <span class="text-xs ml-2">(Total records: [[ userPagination.total ]])</span>
        </span>
        <div class="flex gap-2">
            <button @click="fetchUsersList(userPagination.page - 1)" :disabled="userPagination.page === 1" class="px-3 py-1.5 border border-slate-200 bg-white rounded-md text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
                Previous
            </button>
            <button @click="fetchUsersList(userPagination.page + 1)" :disabled="userPagination.page === userPagination.totalPages" class="px-3 py-1.5 border border-slate-200 bg-white rounded-md text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
                Next
            </button>
        </div>
    </div>
</div>
