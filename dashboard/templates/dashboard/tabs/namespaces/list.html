<div class="mb-6 space-y-4">
    <div class="flex flex-col md:flex-row gap-4 items-center w-full">
        <div class="relative flex-1 w-full min-w-[200px]">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input v-model="search.namespace" type="text" class="w-full rounded-full border border-slate-200 pl-11 pr-4 text-sm font-medium text-slate-900 shadow-sm outline-none focus:ring-2 focus:ring-blue-600 transition-all h-[42px]" placeholder="Search namespaces, tenants, or siglums...">
        </div>
        
        <div class="relative shrink-0 w-full md:w-auto z-10">
            <button @click="uiState.nsClusterOpen = !uiState.nsClusterOpen" type="button" class="w-full bg-white border border-slate-200 rounded-full pl-4 pr-10 py-2 text-sm font-semibold text-slate-700 shadow-sm outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer h-[42px] min-w-[160px] flex items-center justify-between transition-all">
                <span class="truncate">[[ search.namespaceCluster === 'All' ? '🌐 All Clusters' : search.namespaceCluster ]]</span>
                <svg class="absolute right-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 transition-transform duration-200" :class="uiState.nsClusterOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <div v-if="uiState.nsClusterOpen" @click="uiState.nsClusterOpen = false" class="fixed inset-0 z-30 cursor-default"></div>
            <div v-show="uiState.nsClusterOpen" class="absolute left-0 top-full mt-2 w-full min-w-[180px] bg-white border border-slate-200 rounded-2xl shadow-xl py-1.5 z-40 overflow-hidden transform origin-top-left transition-all">
                <div @click="search.namespaceCluster = 'All'; uiState.nsClusterOpen = false" :class="search.namespaceCluster === 'All' ? 'bg-blue-50 text-blue-700' : 'text-slate-700 hover:bg-slate-50'" class="px-4 py-2.5 text-sm font-bold cursor-pointer transition-colors flex items-center gap-2">
                    🌐 All Clusters
                </div>
                <div v-for="c in clustersList" :key="c" @click="search.namespaceCluster = c; uiState.nsClusterOpen = false" :class="search.namespaceCluster === c ? 'bg-blue-50 text-blue-700' : 'text-slate-700 hover:bg-slate-50'" class="px-4 py-2.5 text-sm font-bold cursor-pointer transition-colors flex items-center gap-2">
                    <span :class="search.namespaceCluster === c ? 'bg-blue-500' : 'bg-slate-300'" class="w-2 h-2 rounded-full"></span>[[ c ]]
                </div>
            </div>
        </div>

        <div class="flex bg-slate-100 p-1 rounded-full border border-slate-200 shrink-0 w-full md:w-auto h-[42px]">
            <button @click="search.namespaceStatus = 'active'" :class="search.namespaceStatus === 'active' ? 'bg-white text-slate-900 shadow-sm border-slate-200' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none flex items-center justify-center px-4 rounded-full text-xs font-bold transition-all outline-none border border-transparent"><span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-2"></span> Active</button>
            <button @click="search.namespaceStatus = 'decomm'" :class="search.namespaceStatus === 'decomm' ? 'bg-white text-slate-900 shadow-sm border-slate-200' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none flex items-center justify-center px-4 rounded-full text-xs font-bold transition-all outline-none border border-transparent"><span class="w-1.5 h-1.5 rounded-full bg-red-500 mr-2"></span> Decomm</button>
            <button @click="search.namespaceStatus = 'all'" :class="search.namespaceStatus === 'all' ? 'bg-white text-slate-900 shadow-sm border-slate-200' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none flex items-center justify-center px-4 rounded-full text-xs font-bold transition-all outline-none border border-transparent">All</button>
        </div>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center gap-4 bg-white px-4 py-3 rounded-xl border border-slate-200 shadow-sm overflow-x-auto relative z-0">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider shrink-0 flex items-center gap-1.5 mr-2">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg> Filters
        </span>
        
        <div class="flex items-center gap-2 border-r border-slate-200 pr-4 shrink-0">
            <button @click="search.nsFeatures.dev = !search.nsFeatures.dev" :class="search.nsFeatures.dev ? 'bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-200 shadow-sm' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'" class="px-3 py-1.5 text-xs font-bold border border-slate-200 rounded-full transition-all outline-none">DEV</button>
            <button @click="search.nsFeatures.prod = !search.nsFeatures.prod" :class="search.nsFeatures.prod ? 'bg-green-50 text-green-700 ring-1 ring-inset ring-green-200 shadow-sm' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'" class="px-3 py-1.5 text-xs font-bold border border-slate-200 rounded-full transition-all outline-none">PROD</button>
            <button @click="search.nsFeatures.devspace = !search.nsFeatures.devspace" :class="search.nsFeatures.devspace ? 'bg-purple-50 text-purple-700 ring-1 ring-inset ring-purple-200 shadow-sm' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'" class="px-3 py-1.5 text-xs font-bold border border-slate-200 rounded-full transition-all outline-none">DEVSPACE</button>
            <button @click="search.nsFeatures.cso = !search.nsFeatures.cso" :class="search.nsFeatures.cso ? 'bg-teal-50 text-teal-700 ring-1 ring-inset ring-teal-200 shadow-sm' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'" class="px-3 py-1.5 text-xs font-bold border border-slate-200 rounded-full transition-all outline-none">EGRESS</button>
        </div>

        <div class="flex flex-wrap items-center gap-2 shrink-0">
            <button @click="search.nsFeatures.flows = !search.nsFeatures.flows" :class="search.nsFeatures.flows ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 text-xs font-bold border rounded-full transition-all flex items-center gap-1.5 outline-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg> Flows</button>
            <button @click="search.nsFeatures.dns = !search.nsFeatures.dns" :class="search.nsFeatures.dns ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 text-xs font-bold border rounded-full transition-all flex items-center gap-1.5 outline-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg> DNS</button>
            <button @click="search.nsFeatures.proxy = !search.nsFeatures.proxy" :class="search.nsFeatures.proxy ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 text-xs font-bold border rounded-full transition-all flex items-center gap-1.5 outline-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg> Proxy</button>
            <button @click="search.nsFeatures.templates = !search.nsFeatures.templates" :class="search.nsFeatures.templates ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 text-xs font-bold border rounded-full transition-all flex items-center gap-1.5 outline-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg> CRs</button>
            <button @click="search.nsFeatures.mirror = !search.nsFeatures.mirror" :class="search.nsFeatures.mirror ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 text-xs font-bold border rounded-full transition-all flex items-center gap-1.5 outline-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg> Mirror</button>
            <button @click="search.nsFeatures.routeException = !search.nsFeatures.routeException" :class="search.nsFeatures.routeException ? 'bg-orange-500 text-white border-orange-500 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 text-xs font-bold border rounded-full transition-all flex items-center gap-1.5 outline-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Route Exception</button>
            <!-- Security Exception Filters Moved to the Far Right -->
            <button @click="search.nsFeatures.cveException = !search.nsFeatures.cveException" :class="search.nsFeatures.cveException ? 'bg-orange-50 text-orange-700 ring-1 ring-inset ring-orange-200 shadow-sm' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'" class="px-3 py-1.5 text-xs font-bold border border-slate-200 rounded-full transition-all outline-none flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 8h3M6 8h3m6 4h3M6 12h3m6 4h3M6 16h3M10 8V4m4 4V4M9 8a3 3 0 016 0v8a3 3 0 01-6 0V8z"></path></svg>CVE</button>
        </div>
    </div>
</div>

<div class="data-table-wrapper relative z-0 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
     :class="{ 'is-refreshing': namespacesLoading && namespacesList.length }">
    <table class="data-table w-full m-0 rounded-none border-0">
        <thead class="bg-slate-50 border-b border-slate-200"><tr><th class="py-3 px-4">Namespace</th><th class="py-3 px-4">Tenant</th><th class="py-3 px-4">Cluster</th><th class="py-3 px-4">Features & Status</th></tr></thead>
        <tbody class="divide-y divide-slate-100" :aria-busy="namespacesLoading ? 'true' : 'false'">
            <tr v-for="ns in namespacesList" :key="ns.name" @click="selectItem('namespace', ns.name)" class="hover:bg-blue-50/30 transition-colors cursor-pointer">
                <td class="font-bold text-slate-900 w-1/4 px-4 py-3">
                    <span class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                        <span :class="ns.is_decommissioned ? 'line-through text-slate-400' : 'truncate'" :title="ns.name">[[ ns.name ]]</span>
                    </span>
                </td>
                <td class="text-slate-600 font-medium w-1/6 truncate px-4 py-3" :title="ns.tenant">[[ ns.tenant ]]</td>
                <td class="font-mono text-xs text-slate-500 w-1/6 px-4 py-3">
                    <div class="flex items-center gap-1.5 border border-slate-200 bg-slate-50 px-1.5 py-0.5 rounded shadow-sm inline-flex">
                        <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                        <span class="truncate">[[ ns.cluster ]]</span>
                    </div>
                </td>
                <td class="px-4 py-3">
                    <div class="flex flex-wrap items-center gap-1.5">
                        <span v-if="ns.is_decommissioned" class="badge badge-red !m-0">Decommissioned</span>
                        <template v-else>
                            <span v-if="ns.is_cso" class="badge !bg-teal-100 !text-teal-800 !border-teal-200 !m-0">EGRESS</span>
                            <span v-else-if="ns.lifecycle && !ns.is_devspace" :class="['badge !m-0', ns.lifecycle.toLowerCase() === 'prod' ? 'badge-green' : 'badge-blue']">[[ ns.lifecycle.toUpperCase() ]]</span>
                            <span v-if="ns.is_devspace" class="badge badge-purple !m-0">DEVSPACE</span>
                            
                            <!-- FIX: Removed the text labels from the remaining badges to keep the table clean! -->
                            <span v-if="ns.network_flows?.enabled" title="Custom Flows Enabled" class="badge badge-green !m-0 !px-1.5 !py-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></span>
                            <span v-if="ns.network_flows?.dns" title="DNS Resolution Enabled" class="badge badge-blue !m-0 !px-1.5 !py-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg></span>
                            <span v-if="ns.network_flows?.proxy" title="Proxy Access Enabled" class="badge badge-indigo !m-0 !px-1.5 !py-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg></span>
                            
                            <span v-if="ns.registry_mirrors?.length" title="Custom Registry Mirrors Configured" class="badge badge-slate !m-0 !px-1.5 !py-1 bg-white text-slate-600"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg></span>
                            <span v-if="ns.templates?.length" :title="`Custom Resources: ${ns.templates.length} Templates`" class="badge badge-slate !m-0 !px-1.5 !py-1 bg-white text-slate-700 font-bold"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg></span>
                            <span v-if="ns.routeException?.enabled" title="Route Exception Active" :class="['badge !m-0 !px-1.5 !py-1 text-white font-bold', ns.routeException.status === 'expired' ? 'bg-red-500 ring-red-600' : 'bg-orange-500 ring-orange-600']"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></span>
                            
                            <span v-if="ns.harbor?.cveAllowlist?.length > 0" title="CVE Exception Active" class="badge !bg-orange-100 !text-orange-700 !border-orange-200 !m-0 !px-1.5 !py-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 8h3M6 8h3m6 4h3M6 12h3m6 4h3M6 16h3M10 8V4m4 4V4M9 8a3 3 0 016 0v8a3 3 0 01-6 0V8z"></path></svg></span>
                            <template v-if="ns.operators">
                                <span v-for="(conf, opName) in ns.operators" :key="opName" v-show="conf.enabled" class="badge badge-slate !m-0 !px-1.5 !py-1 bg-white shadow-sm flex items-center justify-center" :title="`Operator: ${opName.replace('Operator', '')}`">
                                    <span v-html="getOperatorIcon(opName)"></span>
                                </span>
                            </template>
                        </template>
                    </div>
                </td>
            </tr>
            <table-skeleton v-if="namespacesLoading && !namespacesList.length" :rows="8" :cols="4"></table-skeleton>
            <tr v-else-if="!namespacesList.length"><td colspan="4" class="text-center italic text-slate-500 py-10 bg-slate-50 border-t border-slate-200">No namespaces match your API criteria.</td></tr>
        </tbody>
    </table>

    <div class="flex items-center justify-between px-6 py-3 bg-slate-50 border-t border-slate-200">
        <span class="text-sm font-medium text-slate-500">
            Showing Page <span class="font-bold text-slate-700">[[ nsPagination.page ]]</span> of <span class="font-bold text-slate-700">[[ nsPagination.totalPages ]]</span> 
            <span class="text-xs ml-2">(Total records: [[ nsPagination.total ]])</span>
        </span>
        <div class="flex gap-2">
            <button @click="fetchNamespacesList(nsPagination.page - 1)" :disabled="nsPagination.page === 1" class="px-3 py-1.5 border border-slate-200 bg-white rounded-md text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
                Previous
            </button>
            <button @click="fetchNamespacesList(nsPagination.page + 1)" :disabled="nsPagination.page === nsPagination.totalPages" class="px-3 py-1.5 border border-slate-200 bg-white rounded-md text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
                Next
            </button>
        </div>
    </div>
</div>
