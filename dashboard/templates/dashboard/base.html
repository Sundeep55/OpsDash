{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ portal_title }}{% endblock %}</title>
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
    {# Utilities the vendored Tailwind build is missing; see `manage.py build_css`. #}
    <link href="{% static 'css/utilities.generated.css' %}" rel="stylesheet">
    <script src="{% static 'js/vue.global.js' %}"></script>
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
