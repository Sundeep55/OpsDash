<header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-1.5 rounded-lg shadow-sm">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-gray-900">Ops Control Plane</h1>
        </div>

        <div class="flex items-center space-x-4">
            <div class="flex items-center text-xs font-medium text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200">
                <span class="relative flex h-2 w-2 mr-2">
                    <span :class="isSyncing ? 'animate-ping bg-blue-400' : 'bg-green-400'" class="absolute inline-flex h-full w-full rounded-full opacity-75"></span>
                    <span :class="isSyncing ? 'bg-blue-500' : 'bg-green-500'" class="relative inline-flex rounded-full h-2 w-2"></span>
                </span>
                [[ syncStatus ]]
            </div>
            
            <button @click="syncData" :disabled="isSyncing" class="inline-flex items-center justify-center rounded-lg bg-gray-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-gray-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 transition-all disabled:opacity-50 disabled:cursor-wait">
                <svg v-if="isSyncing" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                [[ isSyncing ? 'Syncing...' : 'Sync Repository' ]]
            </button>
        </div>
    </div>
</header>
