# =============================================================================
# Customer onboarding pipeline.
#
# This file used to declare 25 inputs, and the registry-mirror equivalent
# declared another 14. GitLab caps a pipeline at 20 *changed* input values on
# every path — including the web UI, not only the API — and a maximal prod
# namespace request already changed exactly 20. There was no room to merge the
# two repos, and none for HCP.
#
# The interface is now two inputs: which operation, and the request as JSON.
# Every field is declared once in request-schema.yaml and enforced by
# pipeline-scripts/load-payload.sh, which turns the payload into the INPUT_*
# variables the scripts already read.
#
# OPERATION is a separate input rather than a key inside the payload because
# `rules:` are evaluated at pipeline-creation time, when GitLab cannot see
# inside the payload string. It also replaces the old CSO_CREATE /
# DECOMMISSION / DECOMMISSION_CSO booleans, which could be set in combinations
# nothing handled.
# =============================================================================
spec:
  inputs:
    OPERATION:
      description: "Which operation to run."
      # Must list every key under `operations:` in request-schema.yaml. GitLab
      # rejects an input value that is not in this list, so an operation missing
      # here cannot be run at all -- not from the web UI, not from the API, and
      # not from either form. tools/check-schema-drift.sh compares the two.
      options:
        - "namespace.create"
        - "namespace.update"
        - "namespace.decommission"
        - "devspace.create"
        - "capsule.create"
        - "capsule.update"
        - "capsule.decommission"
        - "cso.create"
        - "cso.decommission"
        - "mirror.create"
      default: "namespace.create"
    REQUEST_PAYLOAD:
      description: >-
        The request as a JSON object, e.g. {"request_id":"REQ...","tenant_name":"acme",...}.
        Generated by the onboarding form. See request-schema.yaml for the fields
        each operation accepts.
      default: "{}"
    TRIGGERED_BY:
      description: >-
        Who asked for this, when the request did not come from a person driving
        GitLab directly. OpsDash sets it to the signed-in dashboard user; the
        GitLab Pages form leaves it empty, because there the operator's own
        token is already the pipeline user.

        Attribution only -- nothing branches on it. Deliberately NOT the
        requester: `requester_email` in the payload is the customer who raised
        the ITSM ticket, who is a different person from whoever pressed the
        button.
      default: ""
---

# Include the auto-update logic
include:
  - local: '.gitlab/auto-update.yml'

stages:
  - validate
  - scaffold
  - decommission
  - deploy

# Global rather than job-level so `rules:` can read them without depending on
# how `extends:` merges variables.
variables:
  OPERATION: "$[[ inputs.OPERATION ]]"
  REQUEST_PAYLOAD: "$[[ inputs.REQUEST_PAYLOAD ]]"
  TRIGGERED_BY: "$[[ inputs.TRIGGERED_BY ]]"

.base-job:
  image: ${HARBOR_URL}/dcs-internal-images/pipeline-tools:1.1.3
  tags:
    - pipeline
  variables:
    TZ: "Europe/Paris"  # Global Timezone Setting
    GIT_SSL_NO_VERIFY: "true"

# Each operator-triggered job spells its rules out in the same shape: never for
# another operation, then the three sources an operator can trigger from. `web`
# is the Run-pipeline page, `trigger` is a trigger token, `api` is a POST with a
# personal access token.
#
# `api` was missing everywhere before, and `trigger` was missing from
# decommission — which is why an API- or form-driven decommission produced a
# pipeline with no jobs in it at all.

validate-mr-permissions:
  stage: validate
  extends: .base-job
  script:
    - chmod +x ./pipeline-scripts/validate-mr-permissions.sh
    - ./pipeline-scripts/validate-mr-permissions.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"

# The schema is the only place a field is declared, and load-payload.sh is the
# only thing standing between a typo'd payload and the filesystem. Both are
# checked on every merge request that touches them.
#
# Worth keeping: the test suite caught two genuine defects the first time it
# ran, one of which made every `required: true` in the schema invisible.
validate-schema:
  stage: validate
  extends: .base-job
  script:
    - chmod +x ./tools/*.sh
    - ./tools/check-schema-drift.sh
    - ./tools/test-cases.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - request-schema.yaml
        - pipeline-scripts/**/*
        - pages/**/*
        - tools/**/*

scaffold-namespace:
  stage: scaffold
  extends: .base-job
  script:
    - echo ">>> $OPERATION <<<"
    - chmod +x ./pipeline-scripts/*.sh
    - ./pipeline-scripts/scaffold-namespace.sh
  rules:
    - if: '$OPERATION != "namespace.create" && $OPERATION != "namespace.update" && $OPERATION != "devspace.create" && $OPERATION != "cso.create"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

# A capsule is a delegated slice of a tenant: its users create their own
# namespaces against one shared quota. Separate job because it writes a
# different chart (dcs-tenant-provisioner) into a directory that sits alongside
# namespaces and is told apart only by that block name.
scaffold-capsule:
  stage: scaffold
  extends: .base-job
  script:
    - echo ">>> $OPERATION <<<"
    - chmod +x ./pipeline-scripts/*.sh
    - ./pipeline-scripts/scaffold-capsule.sh
  rules:
    - if: '$OPERATION != "capsule.create" && $OPERATION != "capsule.update"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

decommission:
  stage: decommission
  extends: .base-job
  script:
    - echo ">>> $OPERATION <<<"
    - chmod +x ./pipeline-scripts/*.sh
    - ./pipeline-scripts/decommission.sh
  rules:
    - if: '$OPERATION != "namespace.decommission" && $OPERATION != "cso.decommission" && $OPERATION != "capsule.decommission"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

scaffold-mirror:
  stage: scaffold
  extends: .base-job
  script:
    - echo ">>> $OPERATION <<<"
    - chmod +x ./pipeline-scripts/*.sh
    - ./pipeline-scripts/scaffold-mirror.sh
  rules:
    - if: '$OPERATION != "mirror.create"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

# The onboarding form. Static HTML that renders itself from request-schema.yaml,
# so a field added to the schema appears here without anyone touching pages/.
#
# It also emits index.json — every cluster, tenant and namespace in this
# checkout. That is the piece that stops operators writing names down before
# triggering a pipeline, and it is only possible because this repo *is*
# dcs-customer-instances: the job is already standing in the tree it describes.
#
# Rebuilt on every merge to main, which is exactly when tenants and namespaces
# come into existence, since they are created by merging a scaffold branch.
#
# Turn on Pages access control for this project. The index carries requester
# addresses and cost centres — nothing a project member cannot already read from
# the repository, but concentrated into one file.
pages:
  stage: deploy
  extends: .base-job
  script:
    - chmod +x ./tools/*.sh
    - ./tools/build-pages.sh public
    - cp ./tools/cases.json public/
  artifacts:
    paths:
      - public
  rules:
    # Only an actual merge. A form-triggered request also runs on main, so
    # `$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH` alone fired the deploy on every
    # namespace request — republishing an index that had not changed and leaving
    # a misleading deployment trail. A merge arrives as a `push`; web, trigger
    # and api pipelines do not.
    #
    # The inventory only moves when a branch is merged, so that is the only
    # thing that should rebuild it. To republish after a failed deploy, re-run
    # that job from the pipeline — job re-runs ignore `rules`.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
