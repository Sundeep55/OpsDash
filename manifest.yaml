---
# 1. NON-SENSITIVE CONFIGURATION
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-portal-config
  namespace: dcs-cluster-config
  labels:
    app: ops-portal
data:
  # Django Web Server Settings
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "ops-control-plane.com" # Or your specific Route hostname
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://ops-control-plane.com"
  
  # UI Text Variables
  PORTAL_NAME: "Ops Control Plane"
  PORTAL_TITLE: "DCS Operations"
  
  # GitLab Sync Configuration
  GITLAB_URL: "https://gitlab.com"
  GITLAB_PROJECT_ID: "xx"
  GITLAB_BRANCH: "main"
  GITLAB_SSL_VERIFY: "false"
  POLL_INTERVAL_SECONDS: "30"
  
  # GitLab Deep Linking in UI
  GIT_BROWSER_URL: "https://gitlab.com/dcs/dcs-customer-instances/-/tree/main"
  
  # Tell Django to put the SQLite DB in the Persistent Volume
  DATABASE_PATH: "/app/data/db.sqlite3"

---
# 2. SENSITIVE CREDENTIALS (Opaque Secret)

---
# 3. DATABASE STORAGE (PVC)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ops-portal-data
  namespace: dcs-cluster-config
  labels:
    app: ops-portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# 4. THE DEPLOYMENT (Web Server + Sync Sidecar)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-portal
  namespace: dcs-cluster-config
  labels:
    app: ops-portal
spec:
  replicas: 1 # Must remain 1 to prevent SQLite file locking conflicts
  selector:
    matchLabels:
      app: ops-portal
  template:
    metadata:
      labels:
        app: ops-portal
    spec:
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: ops-portal-data
      
      containers:
        # CONTAINER A: The Gunicorn Web Server
        - name: web-server
          image: registry.com/images/ops-control-plane:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ops-portal-config
            - secretRef:
                name: ops-portal-secret
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # --- PROBES ---
          # Every probe sends an explicit Host header. The kubelet otherwise
          # uses the pod IP, which is not in DJANGO_ALLOWED_HOSTS, so Django
          # answers 400 DisallowedHost and every probe fails -- putting the
          # container into CrashLoopBackOff the moment probes are added.
          # The alternative is widening ALLOWED_HOSTS to the pod network;
          # setting the header here keeps that setting tight.

          # entrypoint.sh applies migrations and runs collectstatic before
          # gunicorn binds. The startup probe gives that up to 150s without
          # the liveness probe killing it midway, which is what
          # initialDelaySeconds alone cannot express.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: ops-control-plane.com
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          # Deliberately does not touch the database. A long sync can hold the
          # SQLite write lock, and a liveness probe that queried it would
          # restart the very container holding the connection.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: ops-control-plane.com
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # Checks the database and schema, so a pod with an unmounted or
          # unmigrated volume is pulled from the Service instead of serving
          # errors. Not restarted for it -- that would not fix a bad volume.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
              httpHeaders:
                - name: Host
                  value: ops-control-plane.com
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        # CONTAINER B: The GitLab Polling Sidecar
        - name: sync-sidecar
          image: registry.com/images/ops-control-plane:0.1.0
          imagePullPolicy: Always
          args: ["sidecar"] # Triggers the elif in entrypoint.sh
          envFrom:
            - configMapRef:
                name: ops-portal-config
            - secretRef:
                name: ops-portal-secret
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          # --- PROBES ---
          # The sidecar serves no HTTP, so this is an exec probe against the
          # heartbeat the poll loop writes each iteration. That loop swallows
          # every exception on purpose -- a network blip must not kill the
          # daemon -- which means a wedged iteration would otherwise look
          # healthy indefinitely, since the process is still running.
          #
          # bin/sidecar_health.py imports no Django: a probe every 30s for the
          # life of the pod should not pay Django's startup cost, nor open the
          # SQLite file the sync is writing.
          #
          # The staleness limit derives from POLL_INTERVAL_SECONDS (6x, floor
          # 300s), so changing the interval in the ConfigMap does not silently
          # invalidate this probe.
          livenessProbe:
            exec:
              command: ["python3", "/app/bin/sidecar_health.py"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # No readinessProbe here, on purpose. Both containers share this pod,
          # and the Service selects the pod -- so a sidecar marked unready
          # would pull the *web server* out of the Service and take the
          # dashboard offline. A broken sync means stale data, which is far
          # better than no dashboard. Liveness above still restarts it.

---
# 5. INTERNAL SERVICE
apiVersion: v1
kind: Service
metadata:
  name: ops-portal-svc
  namespace: dcs-cluster-config
  labels:
    app: ops-portal
spec:
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: ops-portal

---
# 6. EXTERNAL ROUTE (OpenShift specific)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ops-portal-route
  namespace: dcs-cluster-config
  labels:
    app: ops-portal
spec:
  to:
    kind: Service
    name: ops-portal-svc
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect