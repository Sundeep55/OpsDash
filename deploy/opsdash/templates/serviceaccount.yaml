{{- if .Values.serviceAccount.create }}
{{/*
Not created by default. The dashboard talks to GitLab over HTTPS and to its own
SQLite file; it makes no Kubernetes API calls, so it needs no identity beyond
the namespace default. Create one only if a policy in the cluster requires
workloads to run as a named ServiceAccount, or to hang an image-pull secret off.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsdash.serviceAccountName" . }}
  labels:
    {{- include "opsdash.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
