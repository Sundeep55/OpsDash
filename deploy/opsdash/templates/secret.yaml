{{- if .Values.secret.create }}
{{/*
Only rendered for installs that are not driven from Git.

If you are reading this because ArgoCD is deploying the chart: leave
secret.create false and create the Secret out of band. Anything rendered here
lands in the values file, and the values file is in the repository.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsdash.secretName" . }}
  labels:
    {{- include "opsdash.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.stringData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
